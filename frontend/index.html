<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Elnet-Tvilling - Transmissionsnet & Komponenter</title>
    <!-- MapLibre GL JS CSS -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <!-- Tailwind CSS til lækkert UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: ui-sans-serif, system-ui, sans-serif; }
        #map { width: 100%; height: 100vh; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex h-screen overflow-hidden">

    <!-- Kort Container -->
    <div id="map" class="flex-1 relative"></div>

    <!-- Substation Inspector Panel (Skjult som udgangspunkt, vises ved klik) -->
    <div id="inspector-panel" class="absolute top-4 right-4 w-96 bg-slate-900/95 backdrop-blur border border-slate-800 rounded-xl shadow-2xl p-5 hidden z-10">
        <div class="flex justify-between items-center pb-3 border-b border-slate-800">
            <h2 id="inspector-title" class="text-lg font-bold text-purple-400">Stationsdetaljer</h2>
            <button onclick="closeInspector()" class="text-slate-400 hover:text-white text-sm bg-slate-800 px-2 py-1 rounded">Luk ✕</button>
        </div>
        <div class="mt-4 space-y-3">
            <div class="bg-slate-800/60 p-3 rounded-lg">
                <p class="text-xs text-slate-400">Overordnet Type & Spænding</p>
                <p id="inspector-meta" class="text-sm font-semibold mt-0.5">-</p>
            </div>
            <div>
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Interne Komponenter & Koblingstilstand</h3>
                <div id="inspector-components" class="space-y-2">
                    <!-- Dynamisk indhold indsat via JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialiser MapLibre GL kort over Danmark med fokus på Fyn/Fraugde
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://demotiles.maplibre.org/style.json', // Eller standard open-source vektorstil
            center: [10.45, 55.39], // Omkring Odense / Fraugde
            zoom: 11
        });

        map.on('load', function () {
            // Tilføj GeoJSON kilde genereret af vores pipeline
            map.addSource('grid-data', {
                type: 'geojson',
                data: './substations.geojson'
            });

            // 1. Lag for transmissionsstationer
            map.addLayer({
                id: 'substations-layer',
                type: 'circle',
                source: 'grid-data',
                filter: ['==', 'category', 'substation'],
                paint: {
                    'circle-radius': 7,
                    'circle-color': '#7c3aed', // Lilla
                    'circle-stroke-width': 2,
                    'circle-stroke-color': '#ffffff'
                }
            });

            // 2. Lag for synkronkompensatorer
            map.addLayer({
                id: 'compensators-layer',
                type: 'circle',
                source: 'grid-data',
                filter: ['==', 'category', 'synchronous_condenser'],
                paint: {
                    'circle-radius': 9,
                    'circle-color': '#f59e0b', // Gylden/Orange
                    'circle-stroke-width': 2,
                    'circle-stroke-color': '#ffffff'
                }
            });

            // Klik-handler til at åbne Substation Inspector med simuleret CIM/komponent-data
            map.on('click', 'substations-layer', function (e) {
                const props = e.features[0].properties;
                openInspector(props);
            });

            map.on('click', 'compensators-layer', function (e) {
                const props = e.features[0].properties;
                openInspector(props);
            });

            // Skift musemarkør ved hover
            map.on('mouseenter', 'substations-layer', () => map.getCanvas().style.cursor = 'pointer');
            map.on('mouseleave', 'substations-layer', () => map.getCanvas().style.cursor = '');
            map.on('mouseenter', 'compensators-layer', () => map.getCanvas().style.cursor = 'pointer');
            map.on('mouseleave', 'compensators-layer', () => map.getCanvas().style.cursor = '');
        });

        function openInspector(props) {
            document.getElementById('inspector-panel').classList.remove('hidden');
            document.getElementById('inspector-title').innerText = props.name || 'Transmissionskomponent';
            document.getElementById('inspector-meta').innerText = `Type: ${props.power \vert{}\vert{} 'Ukendt'} \vert{} Spænding: ${props.voltage || '150/400'} kV`;

            const compContainer = document.getElementById('inspector-components');
            compContainer.innerHTML = `
                <div class="flex justify-between items-center bg-slate-800 p-2.5 rounded text-sm">
                    <span>Samleskinne (Busbar 400 kV)</span>
                    <span class="px-2 py-0.5 text-xs bg-emerald-600 text-emerald-100 rounded font-medium">Spændingssat</span>
                </div>
                <div class="flex justify-between items-center bg-slate-800 p-2.5 rounded text-sm">
