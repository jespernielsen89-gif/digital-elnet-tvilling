<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Elnet-Tvilling - Transmissionskontrolrum</title>
    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: ui-sans-serif, system-ui, sans-serif; background-color: #020617; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100%; z-index: 0; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden">

    <!-- Top Header / Kontrolrum Navbar -->
    <header class="h-14 bg-slate-900/90 backdrop-blur border-b border-slate-800 flex items-center justify-between px-6 z-20">
        <div class="flex items-center space-x-3">
            <div class="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></div>
            <h1 class="font-bold text-base tracking-wide text-slate-100">DK Transmission <span class="text-purple-400 font-normal">Digital Tvilling v2.0</span></h1>
        </div>
        <div class="flex items-center space-x-4 text-xs">
            <span class="bg-slate-800 px-3 py-1 rounded-full border border-slate-700 text-slate-300">Driftsstatus: <strong class="text-emerald-400">Normal (N-1 Sikret)</strong></span>
            <span class="bg-slate-800 px-3 py-1 rounded-full border border-slate-700 text-slate-300">Kilde: <strong class="text-blue-400">OSM + Neo4j + ENTSO-E</strong></span>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex-1 relative flex overflow-hidden">

        <!-- Kort Container -->
        <div id="map"></div>

        <!-- Venstre Sidepanel: Lag & Analyse-styring -->
        <div class="absolute top-4 left-4 w-80 bg-slate-900/90 backdrop-blur border border-slate-800 rounded-xl shadow-2xl p-4 z-10 space-y-4">
            <div>
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Kortlag & Filtre</h3>
                <div class="space-y-2 text-sm">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" checked id="layer-lines" class="rounded bg-slate-800 border-slate-700 text-purple-600 focus:ring-0">
                        <span>Transmissionslinjer & Kabler</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" checked id="layer-subs" class="rounded bg-slate-800 border-slate-700 text-purple-600 focus:ring-0">
                        <span>Stationer (400/150 kV)</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" checked id="layer-comps" class="rounded bg-slate-800 border-slate-700 text-purple-600 focus:ring-0">
                        <span>Synkronkompensatorer</span>
                    </label>
                </div>
            </div>

            <hr class="border-slate-800">

            <div>
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">State Estimator & Simulation</h3>
                <button onclick="runStateEstimation()" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-medium py-2 px-3 rounded-lg text-sm transition shadow-lg shadow-purple-900/30">
                    Kør State Estimator (N-1)
                </button>
                <p id="estimator-status" class="text-xs text-slate-400 mt-2">Status: Afventer simulering...</p>
            </div>
        </div>

        <!-- Højre Sidepanel: Substation Inspector / Komponent Detaljer -->
        <div id="inspector-panel" class="absolute top-4 right-4 w-96 bg-slate-900/95 backdrop-blur border border-slate-800 rounded-xl shadow-2xl p-5 hidden z-10">
            <div class="flex justify-between items-center pb-3 border-b border-slate-800">
                <h2 id="inspector-title" class="text-lg font-bold text-purple-400">Stationsdetaljer</h2>
                <button onclick="closeInspector()" class="text-slate-400 hover:text-white text-sm bg-slate-800 px-2 py-1 rounded">Luk ✕</button>
            </div>
            <div class="mt-4 space-y-3">
                <div class="bg-slate-800/60 p-3 rounded-lg">
                    <p class="text-xs text-slate-400">Overordnet Type & Spænding</p>
                    <p id="inspector-meta" class="text-sm font-semibold mt-0.5">-</p>
                </div>
                <div>
                    <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Interne Komponenter & Koblingstilstand</h3>
                    <div id="inspector-components" class="space-y-2">
                        <!-- Dynamisk indhold -->
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Script til MapLibre og UI Interaktion -->
    <script>
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://demotiles.maplibre.org/style.json',
            center: [10.45, 55.39], // Odense / Fraugde område
            zoom: 10
        });

        map.on('load', function () {
            map.addSource('grid-data', {
                type: 'geojson',
                data: './substations.geojson'
            });

            // Linjelag
            map.addLayer({
                id: 'lines-layer',
                type: 'line',
                source: 'grid-data',
                filter: ['==', 'category', 'line'],
                paint: {
                    'line-color': ['case', ['==', ['get', 'is_hvdc'], true], '#f59e0b', '#ef4444'],
                    'line-width': 2.5
                }
            });

            // Stationslag
            map.addLayer({
                id: 'substations-layer',
                type: 'circle',
                source: 'grid-data',
                filter: ['==', 'category', 'substation'],
                paint: {
                    'circle-radius': 6,
                    'circle-color': '#7c3aed',
                    'circle-stroke-width': 2,
                    'circle-stroke-color': '#ffffff'
                }
            });

            // Kompensatorlag
            map.addLayer({
                id: 'compensators-layer',
                type: 'circle',
                source: 'grid-data',
                filter: ['==', 'category', 'synchronous_condenser'],
                paint: {
                    'circle-radius': 8,
                    'circle-color': '#06b6d4',
                    'circle-stroke-width': 2,
                    'circle-stroke-color': '#ffffff'
                }
            });

            // Event listeners for klik
            map.on('click', 'substations-layer', e => openInspector(e.features[0].properties));
            map.on('click', 'compensators-layer', e => openInspector(e.features[0].properties));
            map.on('click', 'lines-layer', e => openInspector({
                name: e.features[0].properties.name || 'Transmissionslinje',
                power: e.features[0].properties.power_type,
                voltage: e.features[0].properties.voltage || '150/400'
            }));

            // Filter toggles i venstre panel
            document.getElementById('layer-lines').addEventListener('change', (e) => {
                map.setLayoutProperty('lines-layer', 'visibility', e.target.checked ? 'visible' : 'none');
            });
            document.getElementById('layer-subs').addEventListener('change', (e) => {
                map.setLayoutProperty('substations-layer', 'visibility', e.target.checked ? 'visible' : 'none');
            });
            document.getElementById('layer-comps').addEventListener('change', (e) => {
                map.setLayoutProperty('compensators-layer', 'visibility', e.target.checked ? 'visible' : 'none');
            });
        });

        function openInspector(props) {
            document.getElementById('inspector-panel').classList.remove('hidden');
            document.getElementById('inspector-title').innerText = props.name || 'Transmissionskomponent';
            document.getElementById('inspector-meta').innerText = `Type: ${props.power || 'Transmissionsnet'} | Spænding: ${props.voltage || '150/400'} kV`;

            const compContainer = document.getElementById('inspector-components');
            compContainer.innerHTML = `
                <div class="flex justify-between items-center bg-slate-800 p-2.5 rounded text-sm">
                    <span>Samleskinne / Busbar</span>
                    <span class="px-2 py-0.5 text-xs bg-emerald-600 text-emerald-100 rounded font-medium">Spændingssat</span>
                </div>
                <div class="flex justify-between items-center bg-slate-800 p-2.5 rounded text-sm">
                    <span>Effektbryder (Circuit Breaker)</span>
                    <span class="px-2 py-0.5 text-xs bg-blue-600 text-blue-100 rounded font-medium">LUKKET</span>
                </div>
                <div class="flex justify-between items-center bg-slate-800 p-2.5 rounded text-sm">
                    <span>Estimeret Spændingsafvigelse</span>
                    <span class="text-xs text-emerald-400 font-mono">+0.2% (100.2 kV)</span>
                </div>
            `;
        }

        function closeInspector() {
            document.getElementById('inspector-panel').classList.add('hidden');
        }

        function runStateEstimation() {
            const statusEl = document.getElementById('estimator-status');
            statusEl.innerText = "Kører state estimation & lastflyd...";
            statusEl.className = "text-xs text-amber-400 mt-2 animate-pulse";
            
            setTimeout(() => {
                statusEl.innerText = "Simulering gennemført: Konvergeret (3 iterationer). Ingen overbelastninger.";
                statusEl.className = "text-xs text-emerald-400 mt-2 font-medium";
            }, 1200);
        }
    </script>
</body>
</html>
