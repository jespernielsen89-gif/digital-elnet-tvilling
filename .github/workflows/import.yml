name: Import Elnet Data to Neo4j

on:
  workflow_dispatch: # Gør det muligt at starte importen manuelt fra GitHub-fanen "Actions"
  schedule:
    - cron: '0 3 * * *' # Kører automatisk hver nat kl. 03:00 (valgfrit)

jobs:
  import-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests neo4j

      - name: Run Importer Script
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          python data-pipeline/importer.py
