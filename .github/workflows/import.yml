name: Import Elnet Data to GeoJSON

on:
  workflow_dispatch:

jobs:
  import-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r data-pipeline/requirements.txt

      - name: Run Importer Script
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: python data-pipeline/importer.py

      - name: Commit and push generated GeoJSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update elnet GeoJSON data"
          file_pattern: frontend/substations.geojson
