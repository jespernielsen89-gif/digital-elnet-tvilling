name: Import Elnet Data to GeoJSON

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write # Giver tilladelse til at gemme filen tilbage i repoet

jobs:
  import-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Importer Script
        run: |
          python data-pipeline/importer.py

      - name: Commit and push generated GeoJSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/substations.geojson
          git commit -m "chore: opdater substations.geojson automatisk [skip ci]" || echo "Ingen ændringer at committe"
          git push
