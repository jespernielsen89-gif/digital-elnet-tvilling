name: Import Grid & Energy Data

on:
  schedule:
    - cron: '0 3 * * *' # Kører hver nat kl. 03:00
  workflow_dispatch: # Manuel kørsel

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r data-pipeline/requirements.txt

      - name: Run OSM Grid Importer
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          python data-pipeline/importer.py

      - name: Run EnergiDataService Importer
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          python data-pipeline/energidataservice_importer.py

      - name: Run ENTSO-E Importer
        env:
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USER: ${{ secrets.NEO4J_USER }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: |
          python data-pipeline/entsoe_importer.py

      - name: Commit and push updated GeoJSON
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add frontend/substations.geojson
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update grid GeoJSON & Multi-Tier energy data" && git push)
